name: tests

# stdlib-only project (see README.md Prerequisites) -- no dependency install
# step needed. This exists because PR #53 merged into main today past exactly
# one check (GitGuardian), never running the suite that exists to catch
# regressions; a selector nobody calls is a selector nobody can learn from
# (testgraph/hook.py's own rationale for existing), and the same is true of a
# test suite nobody runs automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit shas, matching release.yml. A floating tag is a
      # mutable reference to code that runs with this repo's token; the pins
      # below were each verified to resolve to a COMMIT and not an annotated
      # tag object, which is its own object and does not work as a pin.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests
