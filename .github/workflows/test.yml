name: tests

# stdlib-only project (see README.md Prerequisites) -- no dependency install
# step needed. This exists because PR #53 merged into main today past exactly
# one check (GitGuardian), never running the suite that exists to catch
# regressions; a selector nobody calls is a selector nobody can learn from
# (testgraph/hook.py's own rationale for existing), and the same is true of a
# test suite nobody runs automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    # The package supports 3.11+ (pyproject) and has version-specific code paths
    # (sys.monitoring vs sys.setprofile in the tracer), so a single-version run
    # leaves the others untested (audit M4).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Pinned to commit shas, matching release.yml. A floating tag is a
      # mutable reference to code that runs with this repo's token; the pins
      # below were each verified to resolve to a COMMIT and not an annotated
      # tag object, which is its own object and does not work as a pin.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests

  # The package itself is stdlib-only, but the tests that drive a real pytest
  # (the tracer plugin, verify, the adapter) need pytest importable. Without this
  # job they never run in CI (audit M4).
  unittest-with-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Pinned: the real-pytest tests (tests/test_verify_e2e.py, #114) assert
      # pytest's JUnit and nodeid shapes, which a major release can change.
      - run: python3 -m pip install pytest==9.0.3
      # A missing pytest must fail this job, not skip the real-pytest tests
      # into a green run that exercised nothing (#114 review).
      - run: python3 -m unittest discover -s tests
        env:
          TG_REQUIRE_PYTEST: "1"

  # The release builds with `uv build` (sdist first, then the wheel FROM the sdist), so
  # anything the wheel needs must survive the sdist. A wheel-only build hid exactly that
  # (#165 review): the trace plugin was force-included from a path the sdist dropped.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build
      - name: The wheel built from the sdist carries the trace plugin
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'testgraph/_plugin/tgtrace.py' \
            || { echo "::error::wheel has no testgraph/_plugin/tgtrace.py"; exit 1; }
